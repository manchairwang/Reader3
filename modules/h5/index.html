<!DOCTYPE html>
<html lang="zh" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>阅读 H5</title>
<style>
:root {
  --bg: #ede7da;
  --panel: #f7f4ec;
  --text: #262626;
  --muted: #8a8478;
  --accent: #ed4259;
  --border: #d8d2c4;
  --read-font: 20px;
  --read-bg: #ede7da;
  --read-panel: #f7f4ec;
}
[data-theme='night'] {
  --bg: #1a1a1a;
  --panel: #242424;
  --text: #b8b8b8;
  --muted: #666;
  --accent: #ed4259;
  --border: #383838;
  --read-bg: #101010;
  --read-panel: #1a1a1a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
}

/* 顶栏 */
.topbar, .read-topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.brand { font-size: 20px; font-weight: 600; }
.brand .sub { color: var(--accent); font-size: 12px; font-weight: 400; }
.grow { flex: 1; }
.ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}
.ghost:hover { border-color: var(--accent); }
button {
  background: var(--accent);
  border: none;
  color: #fff;
  padding: 6px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}
.rtitle {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 14px;
}

/* 搜索 */
.search-form {
  flex: 1;
  display: flex;
  gap: 8px;
  max-width: 640px;
  margin: 0 auto;
}
.search-form input {
  flex: 1;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  min-width: 0;
}
.search-form input:focus { outline: 1px solid var(--accent); }

/* 书架 */
.shelf-main { padding: 24px; max-width: 1400px; margin: 0 auto; }
.shelf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 20px;
}
.shelf-book {
  cursor: pointer;
  border-radius: 6px;
  padding: 8px;
  text-align: center;
}
.shelf-book:hover { background: var(--panel); }
.shelf-book img, .cover-fallback {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 4px;
  display: block;
  background: var(--panel);
}
.cover-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: var(--muted);
  border: 1px solid var(--border);
}
.cover-fallback.big { width: 150px; font-size: 40px; }
.bname {
  margin-top: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}
.bauthor { color: var(--muted); font-size: 12px; }

/* 搜索结果 */
.search-main { padding: 16px 24px; max-width: 1000px; margin: 0 auto; }
.result {
  display: flex;
  gap: 14px;
  padding: 12px;
  border-radius: 6px;
  cursor: pointer;
}
.result:hover { background: var(--panel); }
.result img, .result .cover-fallback {
  width: 72px;
  flex: none;
  aspect-r: 3 / 4;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 4px;
}
.rinfo { flex: 1; min-width: 0; }
.rname { font-size: 17px; font-weight: 600; }
.rmeta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.chip {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 6px;
  font-size: 11px;
}
.rlast { color: var(--accent); font-size: 13px; margin-top: 2px; }
.rintro {
  color: var(--muted);
  font-size: 13px;
  margin-top: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.loading { color: var(--muted); padding: 16px 0; text-align: center; }
.done { color: var(--muted); padding: 12px 0; text-align: center; font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 80px 0; }
.empty .hint { font-size: 13px; margin-top: 8px; }

/* 书籍详情 */
.book-main { padding: 24px; max-width: 1200px; margin: 0 auto; }
.bhead { display: flex; gap: 24px; }
.bcover { width: 150px; border-radius: 4px; }
.bhead h1 { margin: 0 0 8px; font-size: 26px; }
.bmeta { color: var(--muted); margin: 0 0 12px; }
.bintro { color: var(--muted); font-size: 14px; max-width: 700px; line-height: 1.6; }
.bbtns { margin-top: 16px; display: flex; gap: 10px; }
.book-cols { display: flex; gap: 24px; margin-top: 24px; }
.toc-box {
  width: 420px;
  flex: none;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  max-height: calc(100vh - 260px);
  overflow-y: auto;
}
.toc-title { font-weight: 600; padding: 14px 16px 8px; }
.toc-item {
  padding: 8px 16px;
  cursor: pointer;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 14px;
}
.toc-item:hover { background: var(--bg); }
.toc-item.cur { color: var(--accent); }
.book-actions { flex: 1; }

/* 阅读页 */
.read-main {
  background: var(--read-bg);
  min-height: calc(100vh - 53px);
}
.read-body {
  max-width: 840px;
  margin: 0 auto;
  padding: 48px 32px 96px;
  background: var(--read-bg);
  font-size: var(--read-font);
  line-height: 1.9;
  color: var(--text);
}
.read-body p {
  margin: 0 0 1em;
  text-indent: 2em;
  word-wrap: break-word;
}

/* 对话框 */
.dlg-mask {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.dlg {
  background: var(--panel);
  color: var(--text);
  border-radius: 8px;
  padding: 24px;
  width: min(480px, 92vw);
  border: 1px solid var(--border);
}
.dlg h3 { margin: 0 0 16px; }
.dlg label {
  display: block;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--muted);
}
.dlg input[type='text'], .dlg input:not([type]), .dlg select {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}
.dlg input[type='range'] { width: 100%; margin-top: 6px; }
.dlg-btns { text-align: right; }
.dlg input:focus-visible, .dlg select:focus-visible,
.ghost:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* AI 生图图片窗口（对应 app PicWindowView，桌面版固定右侧） */
.pic-win {
  position: fixed;
  right: 24px;
  top: 84px;
  bottom: 24px;
  width: min(420px, 32vw);
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  z-index: 20;
}
.pic-win .pic-status {
  color: var(--muted);
  font-size: 13px;
  padding: 8px 12px;
  text-align: center;
}
.pic-win img {
  flex: 1;
  min-height: 0;
  width: 100%;
  object-fit: contain;
  background: var(--bg);
}
.pic-win .pic-info {
  color: var(--muted);
  font-size: 11px;
  padding: 6px 10px;
  min-height: 12px;
  word-break: break-all;
}
/* 阅读正文让出图片窗口空间 */
@media (min-width: 1200px) {
  .read-main { margin-right: min(444px, 34vw); }
}

/* 大屏优化: 1920/4K 下正文限宽居中, 书架列自适应 */
@media (min-width: 2200px) {
  body { font-size: 17px; }
  .shelf-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 28px; }
  .search-main, .book-main { max-width: 1600px; }
  .toc-box { width: 560px; }
  .read-body { max-width: 1000px; padding: 72px 48px 128px; }
  .pic-win { width: min(560px, 30vw); }
}

/* 设置对话框里的 hr/小标题 */
.dlg hr { border: none; border-top: 1px solid var(--border); margin: 4px 0 12px; }
.dlg h4 { margin: 0 0 10px; color: var(--accent); font-size: 14px; }

</style>
</head>

const picMemCache = new Map(); // cacheKey -> {dataUrl, info}
function picCacheGet(key) {
  if (picMemCache.has(key)) return picMemCache.get(key);
  try {
    const all = JSON.parse(localStorage.getItem('h5_pics') || '{}');
    if (all[key]) {
      picMemCache.set(key, all[key]);
      return all[key];
    }
  } catch { }
  return null;
}
function picCachePut(key, dataUrl, info) {
  picMemCache.set(key, { dataUrl, info });
  try {
    const all = JSON.parse(localStorage.getItem('h5_pics') || '{}');
    all[key] = { dataUrl, info };
    const keys = Object.keys(all);
    if (keys.length > 40) delete all[keys[0]]; // 简单 FIFO
    localStorage.setItem('h5_pics', JSON.stringify(all));
  } catch { /* 存储满则放弃持久化 */ }
}

function cleanTags(text) {
  const seen = new Set();
  return text.replace(/[\u4e00-\u9fff]+/g, ' ')
    .split(/[, ]+/).map(s => s.trim())
    .filter(s => s && /[a-z]/i.test(s))
    .filter(s => {
      const k = s.toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k); return true;
    })
    .join(', ').replace(/[, ]{2,}/g, ', ').trim();
}
function extractTags(llmText) {
  const t = String(llmText || '');
  if (/safty|safety|User Safty/i.test(t)) return null;
  const m = t.match(/TAGS:\s*\n?([\s\S]*)/i);
  if (m) { const c = cleanTags(m[1]); if (c) return c }
  const c = cleanTags(t);
  // 数含英文字母的有效 tag（对应 app tagCount ≥ 5）
  const count = c ? c.split(',').filter(s => /[a-z]/i.test(s.trim())).length : 0;
  if (count < 5) return null;
  return c || null;
}
function buildFallbackPrompt(pageText) {
  const base = 'masterpiece, best quality, highly detailed, ancient chinese style, novel illustration';
  const found = [];
  for (const [re, tag] of CN_TAG_MAP) {
    if (re.test(pageText) && !found.includes(tag)) found.push(tag);
  }
  return base + (found.length ? ', ' + found.join(', ') : '');
}
function buildSummaryPrompt(pageText) { return SUMMARY_PROMPT + pageText.slice(0, 1500) }
function isShortPage(text) {
  const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  return cjk < 100 && text.length - cjk < 200;
}
function pageFragments(text) {
  return text.replace(/\s+/g, ' ')
    .split(/[。！？；：…!?;:，、,\n]+/)
    .map(s => s.trim()).filter(s => s.length >= 2 && s.length <= 40)
    .filter((v, i, a) => a.indexOf(v) === i);
}
function mergeKeywords(parts) {
  const seen = new Set(), out = [];
  for (const p of parts) {
    for (const tok of String(p).split(/[,，;；\n]+/)) {
      const t = tok.trim();
      if (!t) continue;
      const k = t.toLowerCase();
      if (!seen.has(k)) { seen.add(k); out.push(t) }
    }
  }
  return out.slice(0, 90).join(', ');
}
function stylePrompt() {
  const st = PICGEN_STYLES[picgenStore.cfg.styleIndex - 1];
  return st ? st.prompt : '';
}

// ---------- HTTP ----------
async function postJson(url, body, token, timeout) {
  const r = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
    },
    body: JSON.stringify(body),
    signal: AbortSignal.timeout(timeout || IMG_TIMEOUT_MS),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.text();
}

// ---------- chat 竞速（提示词 LLM）----------
async function chatOnce(base, token, model, prompt) {
  try {
    const data = await postJson(base + '/v1/chat/completions', {
      model, max_tokens: 800,
      messages: [{ role: 'user', content: prompt }],
    }, token, CHAT_TIMEOUT_MS);
    const obj = JSON.parse(data);
    const msg = obj.choices?.[0]?.message || {};
    const text = msg.content || msg.reasoning_content || '';
    const tags = extractTags(text);
    return tags || null;
  } catch { return null }
}
function raceFirst(promises) {
  return new Promise(resolve => {
    let settled = false;
    promises.forEach(p =>
      p.then(v => { if (!settled && v) { settled = true; resolve(v) } })
       .catch(() => { }));
    Promise.all(promises).then(() => { if (!settled) { settled = true; resolve(null) } });
  });
}
async function chatRace(prompt) {
  const cfg = picgenStore.cfg;
  const tasks = [];
  if (cfg.agnesOn) {
    for (const site of AGNES_SITES) {
      for (const tk of site.tokens) {
        for (const m of AGNES_CHAT_MODELS) {
          tasks.push(chatOnce(site.base, tk, m, prompt));
        }
      }
    }
  }
  if (cfg.customBase && cfg.customToken) {
    const models = cfg.customChatModel ? [cfg.customChatModel] : AGNES_CHAT_MODELS;
    for (const m of models) {
      tasks.push(chatOnce(cfg.customBase, cfg.customToken, m, prompt));
    }
  }
  if (!tasks.length) return null;
  return await raceFirst(tasks);
}

// ---------- 生图 ----------
function parseImageResponse(data) {
  const obj = JSON.parse(data);
  // OpenAI 格式: {data:[{b64_json|url}]}
  if (obj.data && obj.data[0]) {
    const item = obj.data[0];
    if (item.b64_json) return Promise.resolve('data:image/png;base64,' + item.b64_json);
    if (item.url) {
      return fetch(item.url, { signal: AbortSignal.timeout(IMG_TIMEOUT_MS) })
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.blob();
        })
        .then(blob => new Promise(res => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result);
          fr.readAsDataURL(blob);
        }));
    }
  }
  // NIM 格式: {artifacts:[{base64}]}
  if (obj.artifacts && obj.artifacts[0] && obj.artifacts[0].base64) {
    return Promise.resolve('data:image/png;base64,' + obj.artifacts[0].base64);
  }
  return Promise.reject(new Error('生图响应无可识别图片'));
}
async function imageOnce(base, token, model, prompt) {
  const data = await postJson(base + '/v1/images/generations', {
    model, prompt: prompt.slice(0, PROMPT_MAX), n: 1,
    size: '1024x1024', response_format: 'b64_json',
  }, token, IMG_TIMEOUT_MS);
  const dataUrl = await parseImageResponse(data);
  // 全黑检测
  const black = await isBlackImage(dataUrl);
  if (black) throw new Error('生图返回全黑图');
  return { dataUrl, source: model + '@' + base.replace(/^https?:\/\//, '') };
}
function isBlackImage(dataUrl) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      let sum = 0, n = 0;
      const step = Math.max(1, Math.floor((img.width * img.height) / 400));
      const px = ctx.getImageData(0, 0, img.width, img.height).data;
      for (let i = 0; i < px.length; i += 4 * step) {
        sum += px[i] + px[i + 1] + px[i + 2]; n++;
      }
      res(n > 0 && sum / n / 3 < 8);
    };
    img.onerror = () => res(false);
    img.src = dataUrl;
  });
}
async function generateImage(prompt) {
  const cfg = picgenStore.cfg;
  const tasks = [];
  if (cfg.agnesOn) {
    for (const site of AGNES_SITES) {
      const model = AGNES_IMAGE_MODELS[Math.floor(Math.random() * AGNES_IMAGE_MODELS.length)];
      for (const tk of site.tokens.slice(0, 2)) { // 每站最多 2 key 并发，防限流
        tasks.push(imageOnce(site.base, tk, model, prompt).catch(() => null));
      }
    }
  }
  if (cfg.customBase && cfg.customToken && cfg.customImageModel) {
    tasks.push(imageOnce(cfg.customBase, cfg.customToken, cfg.customImageModel, prompt).catch(() => null));
  }
  if (!tasks.length) return null;
  const r = await raceFirst(tasks);
  return r;
}

// ---------- 主入口（对应 app onVisiblePagesChanged + genFor，简化为单页）----------
const picgenJobs = new Map(); // key -> controller
async function picGenFor(cacheKey, pageText, onStatus, onReady) {
  if (!picgenStore.cfg.windowShow) return;
  const cached = picCacheGet(cacheKey);
  if (cached) { onReady(cached.dataUrl, cached.info); return }
  if (picgenJobs.has(cacheKey)) return;
  const ctrl = { cancelled: false };
  picgenJobs.set(cacheKey, ctrl);
  try {
    onStatus('生成提示词…');
    const parts = [];
    if (isShortPage(pageText)) {
      const frags = pageFragments(pageText).slice(0, 12);
      if (frags.length) parts.push(frags.join(', '));
    } else {
      parts.push((await chatRace(buildSummaryPrompt(pageText))) || buildFallbackPrompt(pageText));
    }
    const sp = stylePrompt();
    if (sp) parts.push(sp);
    let prompt = mergeKeywords(parts);
    if (picgenStore.cfg.includeFullText && pageText.trim()) {
      prompt = prompt + '\n' + pageText.trim();
    }
    if (ctrl.cancelled) return;
    onStatus('生成图片…');
    const t0 = Date.now();
    const r = await generateImage(prompt);
    if (ctrl.cancelled) return;
    if (!r) throw new Error('全部生图渠道失败');
    picCachePut(cacheKey, r.dataUrl, r.source);
    onReady(r.dataUrl, r.source + ' ' + ((Date.now() - t0) / 1000).toFixed(1) + 's');
  } catch (e) {
    onStatus('生图失败: ' + e.message);
  } finally {
    picgenJobs.delete(cacheKey);
  }
}
function picGenCancelAll() {
  for (const ctrl of picgenJobs.values()) ctrl.cancelled = true;
  picgenJobs.clear();
}

// ---------- 代理抓取 ----------
// 策略探测（启动时一次）：本地代理 cors-proxy.py → 用户设置代理 → 公共代理
const LOCAL_PROXY = 'http://127.0.0.1:8727/?url={url}';
const PUBLIC_PROXIES = [
  'https://api.allorigins.win/raw?url={url}',
  'https://corsproxy.io/?url={url}',
  'https://api.codetabs.com/v1/proxy?quest={url}',
];
let fetchStrategy = null; // ['proxy', 模板] 或 ['direct']；null=未探测
let strategyProbing = null;

function userProxy() {
  const s = store.settings.proxy.trim();
  return s || null;
}
async function probeStrategy() {
  if (fetchStrategy) return fetchStrategy;
  if (strategyProbing) return strategyProbing;
  strategyProbing = (async () => {
    const testUrl = 'https://www.baidu.com/';
    // 1. 用户设置的代理优先
    const up = userProxy();
    if (up && await probeProxy(up, testUrl)) return ['proxy', up];
    // 2. 本地 cors-proxy.py（双击 start-proxy.bat 即有）
    if (await probeProxy(LOCAL_PROXY, testUrl)) return ['proxy', LOCAL_PROXY];
    // 3. 公共代理逐个探测（3s 快速失败）
    for (const p of PUBLIC_PROXIES) {
      if (await probeProxy(p, testUrl)) return ['proxy', p];
    }
    // 4. 兜底: 直连（仅对带 CORS 头的站点有效）
    try {
      await fetch(testUrl, { signal: AbortSignal.timeout(5000) });
      return ['direct'];
    } catch { }
    return ['proxy', LOCAL_PROXY]; // 全挂时仍返回本地代理（报错信息更明确）
  })();
  const r = await strategyProbing;
  strategyProbing = null;
  fetchStrategy = r;
  return r;
}
async function probeProxy(tpl, testUrl) {
  try {
    const purl = tpl.replace('{url}', encodeURIComponent(testUrl));
    const r = await fetch(purl, { signal: AbortSignal.timeout(4000) });
    return r.ok;
  } catch { return false }
}
// 策略失效时重置（网络变化/代理中途启动）
function resetFetchStrategy() { fetchStrategy = null }

async function pfetch(url, options = {}) {
  const method = (options.method || 'GET').toUpperCase();
  let lastErr;
  for (let attempt = 0; attempt < 2; attempt++) {
    const [kind, tpl] = await probeStrategy();
    try {
      let text;
      if (kind === 'direct') {
        const r = await fetch(url, {
          method,
          headers: options.headers || {},
          signal: AbortSignal.timeout(options.timeoutMs || 15000),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        text = await r.text();
      } else {
        const purl = tpl.replace('{url}', encodeURIComponent(url));
        const opt = {
          method,
          headers: Object.assign({ 'x-requested-with': 'XMLHttpRequest' }, options.headers || {}),
          signal: AbortSignal.timeout(options.timeoutMs || 20000),
        };
        if (method !== 'GET' && options.body != null) opt.body = options.body;
        const r = await fetch(purl, opt);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const buf = await r.arrayBuffer();
        const charset = (options.charset || 'utf-8').toLowerCase();
        text = new TextDecoder(charset === 'utf8' ? 'utf-8' : charset).decode(buf);
      }
      return text;
    } catch (e) {
      lastErr = e;
      // 第一次失败: 策略可能已失效(代理中途关了), 重探测一次再试
      if (attempt === 0) {
        fetchStrategy = null;
        continue;
      }
    }
  }
  throw lastErr || new Error('抓取失败');
}

// ---------- JSONPath 简化版 ----------
function jsonPath(obj, path) {
  if (!path.startsWith('$')) return undefined;
  path = path.replace(/\[\*\]/g, ''); // $..search[*] -> $..search
  const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.').slice(1);
  // $..name 递归
  if (path.startsWith('$..')) {
    const name = parts[parts.length - 1];
    const out = [];
    (function walk(o) {
      if (o && typeof o === 'object') {
        if (Array.isArray(o)) o.forEach(walk);
        else {
          for (const k in o) {
            if (k === name) out.push(o[k]);
            walk(o[k]);
          }
        }
      }
    })(obj);
    return out;
  }
  let cur = obj;
  for (const p of parts) {
    if (cur == null) return undefined;
    if (p === '') continue;
    cur = cur[p];
  }
  return cur;
}

// ---------- 规则引擎(AnalyzeRule 简化移植) ----------
class Analyzer {
  constructor(content, baseUrl) {
    this.baseUrl = baseUrl || '';
    const s = String(content).trim();
    this.isJSON = s.length > 0 && (s.startsWith('{') || s.startsWith('['));
    if (this.isJSON) {
      try { this.json = JSON.parse(s) } catch { this.isJSON = false }
    }
    if (!this.isJSON) {
      this.doc = new DOMParser().parseFromString(s, 'text/html');
    }
  }
  raw() { return this.isJSON ? this.json : this.doc }

  // 主入口: 求值一条取文本规则
  getString(rule, ctx) {
    if (!rule) return '';
    rule = String(rule).trim();
    // || 备选
    for (const alt of splitTop(rule, '||')) {
      const v = this.getStringSingle(alt.trim(), ctx);
      if (v) return v;
    }
    return '';
  }
  getStringSingle(rule, ctx) {
    // && 拼接
    const ands = splitTop(rule, '&&');
    const parts = ands.map(r => this.evalSingle(r.trim(), ctx, true));
    if (ands.length > 1) return parts.filter(Boolean).join('\n');
    return parts[0] || '';
  }
  evalSingle(rule, ctx, asText) {
    // ## 正则清除
    let clean = null;
    if (rule.includes('##')) {
      const i = rule.indexOf('##');
      clean = rule.slice(i + 2);
      rule = rule.slice(0, i);
    }
    let result = '';
    if (rule.startsWith('@get:') || rule.startsWith('@js:')) {
      result = ''; // 简化: 不支持 js
    } else if (rule.startsWith('{{') && rule.endsWith('}}')) {
      // JSON 模板
      result = this.isJSON ? templateJson(this.json, rule) : '';
    } else if (this.isJSON || rule.startsWith('$')) {
      const v = jsonPath(this.json, rule);
      result = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
    } else if (ctx) {
      // 在元素上下文里求值(相对规则)
      result = analyzeHtmlEl(ctx, rule, this.baseUrl);
    } else {
      result = analyzeHtmlEl(this.doc, rule, this.baseUrl);
    }
    if (clean && result) {
      try {
        const re = new RegExp(clean, 'g');
        result = result.replace(re, '');
      } catch { /* 正则非法忽略 */ }
    }
    return (result || '').trim();
  }

  // 列表规则: 返回元素/对象数组
  getElements(rule) {
    rule = String(rule || '').trim();
    if (rule.startsWith('[') && rule.endsWith(']')) rule = rule.slice(1, -1); // 兼容 [xxx] 包裹
    for (const alt of splitTop(rule, '||')) {
      const r = alt.trim();
      let list = null;
      if (this.isJSON && !r.includes('@') || r.startsWith('$')) {
        const v = jsonPath(this.json, r);
        // 压平嵌套数组($..search 递归命中会包一层)
        list = (Array.isArray(v) ? v.flat(2) : (v == null ? [] : [v]));
      } else {
        list = selectElements(this.doc, r, this.baseUrl);
      }
      if (list && list.length) return list;
    }
    return [];
  }
}

// 顶层分割(忽略 {{}} 内的分隔符)
function splitTop(rule, sep) {
  const out = [];
  let depth = 0, cur = '';
  for (let i = 0; i < rule.length; i++) {
    const two = rule.substr(i, 2);
    if (two === '{{') { depth++; cur += two; i++; continue }
    if (two === '}}') { depth--; cur += two; i++; continue }
    if (depth === 0 && two === sep) { out.push(cur); cur = ''; i++; continue }
    cur += rule[i];
  }
  out.push(cur);
  return out;
}

// JSON 模板 {{$.a}} {{$.b}}
function templateJson(json, tpl) {
  return tpl.replace(/\{\{([^}]+)\}\}/g, (_, p) => {
    const v = jsonPath(json, p.trim());
    return v == null ? '' : String(v);
  }).trim();
}

// ---------- HTML 规则 ----------
const TERMINALS = new Set(['text', 'textNodes', 'html', 'all', 'ownText', 'href', 'src']);
function selectElements(root, rule, baseUrl) {
  // 返回元素数组; rule 可含 @ 终端
  const steps = rule.split('@');
  let cur = [root];
  for (let i = 0; i < steps.length; i++) {
    const step = steps[i].trim();
    if (!step) continue;
    const isLast = i === steps.length - 1;
    if (isLast && (TERMINALS.has(step) || step.startsWith('data-'))) break; // 终端由取值处理
    const next = [];
    for (const node of cur) {
      next.push(...selectStep(node, step));
    }
    cur = next;
  }
  return cur;
}
function selectStep(scope, step) {
  // legado 风格: class.x / tag.a / id.x / text.x + 索引; 或原生 CSS
  let m = step.match(/^(class|tag|id|text)\.(.+)$/);
  let css = null, textIdx = -1;
  if (m) {
    let kind = m[1], rest = m[2];
    let idx = null, exclude = false;
    const im = rest.match(/^(.*?)(!)?(\d+|-\d+)$/);
    if (im) { rest = im[1]; idx = parseInt(im[3]); exclude = !!im[2] }
    if (kind === 'class') css = '.' + rest.replace(/\./g, '.');
    else if (kind === 'tag') css = rest;
    else if (kind === 'id') css = '#' + rest;
    else if (kind === 'text') { textIdx = idx; idx = null; }
    const nodes = css != null
      ? Array.from((scope instanceof Document ? scope.documentElement : scope).querySelectorAll(css))
      : Array.from(scope.querySelectorAll('*')).filter(e =>
          e.children.length === 0 && (e.textContent || '').trim());
    if (textIdx != null && textIdx > -1) return [nodes[textIdx]].filter(Boolean);
    if (idx != null) {
      if (exclude) { nodes.splice(idx, 1); return nodes }
      return [nodes[idx]].filter(Boolean);
    }
    return nodes;
  }
  // 原生 CSS 兜底
  try { return Array.from(scope.querySelectorAll(step)) } catch { return [] }
}
function analyzeHtmlEl(ctx, rule, baseUrl) {
  // 在给定元素(ctx)上求值文本规则
  const steps = rule.split('@');
  let nodes = [ctx];
  let terminal = steps[steps.length - 1].trim();
  const hasTerminal = TERMINALS.has(terminal) || terminal.startsWith('data-')
    || /^[\w-]+$/.test(terminal) && steps.length > 1 && terminal !== 'text'
    ? TERMINALS.has(terminal) || terminal.startsWith('data-')
    : (TERMINALS.has(terminal) || terminal.startsWith('data-'));
  let elementSteps = hasTerminal ? steps.slice(0, -1) : steps;
  for (const step of elementSteps) {
    const s = step.trim();
    if (!s) continue;
    const next = [];
    for (const n of nodes) next.push(...selectStep(n, s));
    nodes = next;
    if (!nodes.length) return '';
  }
  if (!nodes.length) return '';
  const node = nodes[0];
  if (!hasTerminal) return node.textContent || '';
  if (terminal === 'text') return node.textContent || '';
  if (terminal === 'textNodes') {
    return Array.from(node.childNodes).map(n => n.textContent).join('');
  }
  if (terminal === 'html') return node.innerHTML || '';
  if (terminal === 'all') return node.outerHTML || '';
  if (terminal === 'href' || terminal === 'src') return absUrl(node.getAttribute(terminal), baseUrl);
  const attr = node.getAttribute(terminal);
  return attr == null ? '' : attr;
}

// ---------- AnalyzeUrl 简化 ----------
function buildRequest(ruleUrl, key, page, sourceUrl) {
  let url = String(ruleUrl || ''), options = {};
  const i = url.lastIndexOf(',{');
  if (i > -1 && url.trim().endsWith('}')) {
    try {
      options = JSON.parse(url.slice(i + 1));
      url = url.slice(0, i);
    } catch { /* 不是选项 */ }
  }
  url = url.replace(/\{\{key\}\}/g, encodeURIComponent(key || ''))
    .replace(/\{\{page\}\}/g, page || 1)
    .replace(/searchKey/g, key || '')
    .replace(/searchPage/g, page || 1);
  if (options.body) {
    options.body = String(options.body)
      .replace(/\{\{key\}\}/g, key || '')
      .replace(/searchKey/g, key || '');
  }
  if (!/^https?:/.test(url)) url = absUrl(url, sourceUrl);
  return { url, options };
}

// ---------- 抓书流程 ----------
async function searchSource(source, key) {
  const { url, options } = buildRequest(source.searchUrl, key, 1, source.bookSourceUrl);
  const headers = {};
  try { Object.assign(headers, JSON.parse(source.header || '{}')) } catch { }
  Object.assign(headers, options.headers || {});
  const body = await pfetch(url, {
    method: options.method, body: options.body, headers, charset: options.charset,
  });
  const az = new Analyzer(body, url);
  const ruleS = source.ruleSearch || {};
  const list = az.getElements(ruleS.bookList);
  const results = [];
  for (const item of list) {
    let name = az.getString(ruleS.name) // 顶层再算一遍会重复body; 见下
    break; // 占位,实际循环在下方
  }
  // 正确做法: 每条记录创建子 Analyzer 上下文
  const out = [];
  for (const item of list) {
    const sub = new Analyzer(
      (typeof item === 'object' && item instanceof Element) ? item.outerHTML : JSON.stringify(item),
      url);
    if (sub.isJSON) sub.json = item;
    const g = (rule) => {
      if (!rule) return '';
      let r = rule;
      // 相对规则: 元素上下文
      return sub.getString(r, item);
    };
    const name = g(ruleS.name), author = g(ruleS.author);
    let bookUrl = g(ruleS.bookUrl);
    if (!name || !bookUrl) continue;
    if (!/^https?:/.test(bookUrl)) bookUrl = absUrl(bookUrl, source.bookSourceUrl);
    out.push({
      name, author: author || '',
      bookUrl,
      coverUrl: absUrl(g(ruleS.coverUrl), source.bookSourceUrl),
      intro: g(ruleS.intro),
      lastChapter: g(ruleS.lastChapter),
      kind: g(ruleS.kind),
      sourceUrl: source.bookSourceUrl, sourceName: source.bookSourceName,
    });
  }
  return out;
}

async function getBookInfo(book) {
  const source = findSource(book.sourceUrl);
  const headers = {};
  try { Object.assign(headers, JSON.parse(source.header || '{}')) } catch { }
  const body = await pfetch(book.bookUrl, { headers });
  const az = new Analyzer(body, book.bookUrl);
  const rule = source.ruleBookInfo || {};
  const g = r => az.getString(r);
  const info = {
    name: g(rule.name) || book.name,
    author: g(rule.author) || book.author,
    coverUrl: absUrl(g(rule.coverUrl) || book.coverUrl, book.bookUrl),
    intro: g(rule.intro) || book.intro,
    lastChapter: g(rule.lastChapter),
    tocUrl: g(rule.tocUrl) || book.bookUrl,
  };
  if (!/^https?:/.test(info.tocUrl)) info.tocUrl = absUrl(info.tocUrl, book.bookUrl);
  return info;
}

async function getCatalog(book, tocUrl) {
  const source = findSource(book.sourceUrl);
  const headers = {};
  try { Object.assign(headers, JSON.parse(source.header || '{}')) } catch { }
  const body = await pfetch(tocUrl, { headers });
  const az = new Analyzer(body, tocUrl);
  const rule = source.ruleToc || {};
  const list = az.getElements(rule.chapterList);
  const out = [];
  for (const item of list) {
    const sub = new Analyzer(
      (typeof item === 'object' && item instanceof Element) ? item.outerHTML : JSON.stringify(item),
      tocUrl);
    if (sub.isJSON) sub.json = item;
    let url = sub.getString(rule.chapterUrl, item);
    if (!url) continue;
    if (!/^https?:/.test(url)) url = absUrl(url, tocUrl);
    out.push({ title: (sub.getString(rule.chapterName, item) || '').trim(), url });
  }
  // 倒序检测: 第一章 url 大于最后一章则反转
  if (out.length > 1 && out[0].url > out[out.length - 1].url) out.reverse();
  return out;
}

async function getContent(book, chapterUrl) {
  const source = findSource(book.sourceUrl);
  if (!source) throw new Error('书源不存在: ' + book.sourceUrl + '（书源可能已被移除）');
  const headers = {};
  try { Object.assign(headers, JSON.parse(source.header || '{}')) } catch { }
  const { url, options } = (() => {
    // 章节 url 可带 ,{options}
    let u = chapterUrl, o = {};
    const i = u.lastIndexOf(',{');
    if (i > -1 && u.trim().endsWith('}')) {
      try { o = JSON.parse(u.slice(i + 1)); u = u.slice(0, i) } catch { }
    }
    return { url: u, options: o };
  })();
  Object.assign(headers, options.headers || {});
  const body = await pfetch(url, { method: options.method, body: options.body, headers });
  const az = new Analyzer(body, url);
  const raw = az.getString(source.ruleContent?.content);
  return cleanContent(raw);
}

function cleanContent(raw) {
  if (!raw) return ['正文为空'];
  let s = raw
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'");
  const lines = s.split(/\n+/).map(l => l.trim()).filter(l => l.length > 0);
  return lines.length ? lines : ['正文为空'];
}

function findSource(sourceUrl) {
  return SOURCES.find(s => s.bookSourceUrl === sourceUrl);
}

async function doSearch(key) {
  state.searchKey = key;
  state.searchResults = [];
  state.view = 'search';
  render();
  const status = el('#searchStatus'), list = el('#searchList');
  status.innerHTML = `<div class="loading">探测网络…</div>`;
  const [kind] = await probeStrategy();
  let hint = '';
  if (kind === 'proxy' && fetchStrategy[1] === LOCAL_PROXY) {
    hint = `<div class="hint">已连接本地代理 (127.0.0.1:8727)。若持续无结果，请确认 start-proxy.bat 在运行。</div>`;
  } else if (kind === 'proxy') {
    hint = `<div class="hint">使用代理: ${esc(fetchStrategy[1].slice(0, 50))}</div>`;
  } else {
    hint = `<div class="hint">直连模式（仅部分带 CORS 的站点可用）。搜索无结果时请双击 start-proxy.bat 启动本地代理后重试。</div>`;
  }
  status.innerHTML = `<div class="loading">搜索中: 0/${SOURCES.length} 源</div>${hint}`;
  let done = 0, found = 0;
  const queue = [...SOURCES];
  const workers = new Array(Math.min(6, queue.length)).fill(0).map(async () => {
    while (queue.length) {
      const src = queue.shift();
      try {
        const rs = await searchSource(src, key);
        found += rs.length;
        state.searchResults.push(...rs);
        drawResults(list);
      } catch (e) { window.__searchErrors = (window.__searchErrors || []).concat(src.bookSourceName + ': ' + e.message) }
      done++;
      status.innerHTML = `<div class="loading">搜索中: ${done}/${SOURCES.length} 源, 已找到 ${found} 本</div>${hint}`;
    }
  });
  await Promise.all(workers);
  status.innerHTML = `<div class="done">完成: ${found} 本结果</div>${hint}`;
}
function drawResults(list) {
  const rs = [...state.searchResults].sort((a, b) => a.name.length - b.name.length);

}

/** 取当前阅读窗口可视文本（viewport 内段落拼起来） */
function visibleText() {
  const body = el('#readBody');
  if (!body) return '';
  const paras = Array.from(body.querySelectorAll('p'));
  const vh = window.innerHeight;
  let text = '';
  for (const p of paras) {
    const r = p.getBoundingClientRect();
    if (r.bottom > 0 && r.top < vh) text += p.textContent + '\n';
  }
  return text.trim();
}
function triggerPicGen() {
  const cfg = picgenStore.cfg;
  const win = el('#picWin');
  if (!cfg.windowShow) { if (win) win.style.display = 'none'; return }
  win.style.display = 'flex';
  // 阅读位置 key：书+章+滚动位置（每屏一张，对应 app 分页生图）
  const key = state.currentBook.bookUrl + '#' + state.chapterIndex +
    '#' + Math.floor(window.scrollY / window.innerHeight);
  picGenFor(key, visibleText(),
    s => { el('#picStatus').textContent = s; el('#picImg').style.display = 'none' },
    (dataUrl, info) => {
      el('#picStatus').textContent = '';
      const img = el('#picImg');
      img.src = dataUrl;
      img.style.display = 'block';
      el('#picInfo').textContent = picgenStore.cfg.showInfo ? info : '';
    });
}

  if (state.chapterIndex < state.catalog.length - 1) startRead(state.chapterIndex + 1);
}
function backToBook() {
  state.view = 'book';
  render();
}
function startRead(idx) {
  state.chapterIndex = idx;
  state.view = 'read';
  render();
}
function saveProgress(pos) {
  const p = store.progress;
  p[state.currentBook.bookUrl] = { chapterIndex: state.chapterIndex, pos };
  store.progress = p;
}

// ---------- 设置 ----------
function openSettings() {
  const s = store.settings;
  const p = picgenStore.cfg;
  let dlg = el('#settingsDlg');
  if (dlg) dlg.remove();
  dlg = document.createElement('div');
  dlg.id = 'settingsDlg';
  dlg.className = 'dlg-mask';
  dlg.innerHTML = `
    <div class="dlg">
      <h3>设置</h3>
      <label>正文字号 <span id="fsVal">${s.fontSize}</span>px
        <input id="fsRange" type="range" min="14" max="40" value="${s.fontSize}">
      </label>
      <label>主题
        <select id="themeSel">
          <option value="day" ${s.theme === 'day' ? 'selected' : ''}>日间</option>
          <option value="night" ${s.theme === 'night' ? 'selected' : ''}>夜间</option>
        </select>
      </label>
      <label>CORS 代理 (推荐双击 start-proxy.bat 启动本地代理自动生效; 也可填自有代理, 含 {url} 占位符)
        <input id="proxyInput" placeholder="https://your-proxy.com/?url={url}"
          value="${esc(s.proxy)}">
      </label>
      <hr>
      <h4>AI 生图</h4>
      <label><input type="checkbox" id="pgWin" ${p.windowShow ? 'checked' : ''}> 阅读时显示图片窗口</label>
      <label>生图风格
        <select id="pgStyle">
          <option value="0" ${p.styleIndex === 0 ? 'selected' : ''}>未选择</option>
          ${PICGEN_STYLES.map((st, i) =>
            `<option value="${i + 1}" ${p.styleIndex === i + 1 ? 'selected' : ''}>${esc(st.name)}</option>`).join('')}
        </select>
      </label>
      <label><input type="checkbox" id="pgAgnes" ${p.agnesOn ? 'checked' : ''}> agnes 免费生图渠道（内置 key 竞速）</label>
      <label>自定义 OpenAI 兼容站 Base（如 https://api.openai.com）
        <input id="pgBase" placeholder="https://your-gateway.com" value="${esc(p.customBase)}">
      </label>
      <label>API Key
        <input id="pgToken" placeholder="sk-..." value="${esc(p.customToken)}">
      </label>
      <label>生图模型名
        <input id="pgImgModel" placeholder="如 flux.1-schnell / agnes-image-2.5-flash"
          value="${esc(p.customImageModel)}">
      </label>
      <label>摘要模型名（留空用 agnes 兜底）
        <input id="pgChatModel" placeholder="如 gpt-4o-mini" value="${esc(p.customChatModel)}">
      </label>
      <label><input type="checkbox" id="pgInfo" ${p.showInfo ? 'checked' : ''}> 图片窗口显示生成信息</label>
      <label><input type="checkbox" id="pgFull" ${p.includeFullText ? 'checked' : ''}> 提示词附带当前屏全文</label>
      <div class="dlg-btns">
        <button class="ghost" onclick="this.closest('.dlg-mask').remove()">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(dlg);
  el('#fsRange').oninput = e => {
    el('#fsVal').textContent = e.target.value;
    const ns = store.settings; ns.fontSize = +e.target.value; store.settings = ns;
    document.documentElement.style.setProperty('--read-font', e.target.value + 'px');
  };
  el('#themeSel').onchange = e => {
    const ns = store.settings; ns.theme = e.target.value; store.settings = ns;
    document.documentElement.dataset.theme = e.target.value;
  };
  el('#proxyInput').onchange = e => {
    const ns = store.settings; ns.proxy = e.target.value.trim(); store.settings = ns;
    resetFetchStrategy();
  };
  // AI 生图设置
  const savePg = () => { picgenStore.cfg = p };
  el('#pgWin').onchange = e => { p.windowShow = e.target.checked; savePg(); triggerPicGen() };
  el('#pgStyle').onchange = e => { p.styleIndex = +e.target.value; savePg() };
  el('#pgAgnes').onchange = e => { p.agnesOn = e.target.checked; savePg() };
  el('#pgBase').onchange = e => { p.customBase = e.target.value.trim(); savePg() };
  el('#pgToken').onchange = e => { p.customToken = e.target.value.trim(); savePg() };
  el('#pgImgModel').onchange = e => { p.customImageModel = e.target.value.trim(); savePg() };
  el('#pgChatModel').onchange = e => { p.customChatModel = e.target.value.trim(); savePg() };
  el('#pgInfo').onchange = e => { p.showInfo = e.target.checked; savePg() };
  el('#pgFull').onchange = e => { p.includeFullText = e.target.checked; savePg() };
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.remove() });
}

// ---------- 键盘 ----------
document.addEventListener('keydown', e => {
  if (state.view !== 'read') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') prevChapter();
  if (e.key === 'ArrowRight') nextChapter();
});

// ---------- 路由 ----------
function go(view) { state.view = view; render(); }
window.go = go; window.doSearch = doSearch; window.openResult = openResult;
window.openShelfBook = openShelfBook; window.startRead = startRead;
window.toggleShelf = toggleShelf; window.openSettings = openSettings;
window.prevChapter = prevChapter; window.nextChapter = nextChapter;
window.backToBook = backToBook;
window.resetFetchStrategy = resetFetchStrategy;

// 启动
document.documentElement.style.setProperty('--read-font', store.settings.fontSize + 'px');
render();

</script>
</body>
</html>
